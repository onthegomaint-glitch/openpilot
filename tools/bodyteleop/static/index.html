<html>
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>commabody</title>
    <link rel="stylesheet" href="/static/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.2.3/css/bootstrap.min.css" integrity="sha512-SbiR/eusphKoMVVXysTKG/7VseWii+Y3FdHrt0EpKgpToZeemhqHeZeLWLhJutz/2ut2Vw1uQEj2MbRF+TVBUA==" crossorigin="anonymous" referrerpolicy="no-referrer" /><script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.2.3/js/bootstrap.min.js" integrity="sha512-1/RvZTcCDEUjY/CypiMz+iqqtaoQfAITmNSJY17Myp4Ms5mdxPS5UV7iOfdZoxcGhzFbOm6sntTKJppjvuhg4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@^3"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@^2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@^1"></script>
  </head>
  <body>
    <div id="main">
      <p class="jumbo">comma body</p>
      <audio id="audio" autoplay="true"></audio>
      <video id="video" playsinline autoplay muted loop poster="/static/poster.png"></video>
      <div id="camera-fallback" class="camera-fallback d-none">
        <div class="camera-fallback-toolbar">
          <select id="snapshot-camera" class="form-select form-select-sm">
            <option value="wide" selected>Wide snapshot</option>
            <option value="road">Road snapshot</option>
            <option value="driver">Driver snapshot</option>
          </select>
          <button id="snapshot-refresh" class="btn btn-outline-light btn-sm" type="button">Refresh Snapshot</button>
        </div>
        <img id="camera-snapshot" class="camera-snapshot" alt="Camera snapshot">
        <div id="camera-status" class="command-result">Live video unavailable. Snapshot fallback is ready.</div>
      </div>
      <div id="icon-panel" class="row">
        <div class="col-sm-12 col-md-6 details">
          <div class="icon-sup-panel col-12">
            <div class="icon-sub-panel">
              <div class="icon-sub-sub-panel">
                <i class="bi bi-speaker-fill pre-blob"></i>
                <i class="bi bi-mic-fill pre-blob"></i>
                <i class="bi bi-camera-video-fill pre-blob"></i>
              </div>
              <p class="small">body</p>
            </div>
            <div class="icon-sub-panel">
              <div class="icon-sub-sub-panel">
                <i class="bi bi-speaker-fill pre-blob"></i>
                <i class="bi bi-mic-fill pre-blob"></i>
              </div>
              <p class="small">you</p>
            </div>
          </div>
        </div>
        <div class="col-sm-12 col-md-6 details">
          <div class="icon-sup-panel col-12">
            <div class="icon-sub-panel">
              <div class="icon-sub-sub-panel">
                <i id="ping-time" class="pre-blob1">-</i>
              </div>
              <p class="bi bi-arrow-repeat small"> ping time</p>
            </div>
            <div class="icon-sub-panel">
              <div class="icon-sub-sub-panel">
                <i id="battery" class="pre-blob1">-</i>
              </div>
              <p class="bi bi-battery-half small"> battery</p>
            </div>
            <div class="icon-sub-panel">
              <div class="icon-sub-sub-panel">
                <i id="device-voltage" class="pre-blob1">-</i>
              </div>
              <p class="bi bi-lightning-charge small"> device volts</p>
            </div>
          </div>
        </div>
        <!-- <div class="icon-sub-panel">
                <button type="button" id="start" class="btn btn-light btn-lg">Start</button>
                <button type="button" id="stop" class="btn btn-light btn-lg">Stop</button>
            </div> -->
      </div>
      <div class="row" style="padding: 0px 10px 0px 10px; width: 100%;">
        <div class="panel row">
          <div class="col-sm-6"><canvas id="chart-ping"></canvas></div>
          <div class="col-sm-6"><canvas id="chart-battery"></canvas></div>
        </div>
      </div>
      <div class="row" style="padding: 0px 10px 0px 10px; width: 100%;">
        <div class="panel row controls-panel" id="auth-panel">
          <div id="auth-result" class="col-12 command-result">Local network access enabled</div>
        </div>
      </div>
      <div class="row" style="padding: 0px 10px 0px 10px; width: 100%;">
        <div class="panel row controls-panel">
          <div class="col-12">
            <div class="btn-group w-100" role="group">
              <button id="tab-controls" class="btn btn-light active" type="button">Controls</button>
              <button id="tab-capture" class="btn btn-outline-light" type="button">Data Capture</button>
              <button id="tab-videos" class="btn btn-outline-light" type="button">Video Library</button>
            </div>
          </div>
          <div class="col-12">
            <div class="command-result">Authentication disabled while LAN controls are being stabilized.</div>
          </div>
          <div id="controls-tab" class="row g-2 w-100">
            <div class="col-sm-4 col-12"><button id="cmd-remote-start" class="btn btn-danger w-100">Request Remote Start</button></div>
            <div class="col-12 remote-start-ac">
            <div class="row g-2">
              <div class="col-sm-3 col-6"><label><input id="ac-enabled" type="checkbox" checked> A/C On</label></div>
              <div class="col-sm-3 col-6"><label><input id="ac-front-defrost" type="checkbox"> Front Defrost</label></div>
              <div class="col-sm-3 col-6"><label>Temp C <input id="ac-temp-c" type="number" min="16" max="30" value="21" class="form-control form-control-sm"></label></div>
              <div class="col-sm-3 col-6"><label>Fan 0-5 <input id="ac-fan-level" type="number" min="0" max="5" value="2" class="form-control form-control-sm"></label></div>
            </div>
            </div>
            <div class="col-sm-4 col-12"><button id="cmd-charge-start" class="btn btn-success w-100">Start Charging</button></div>
            <div class="col-sm-4 col-12"><button id="cmd-charge-stop" class="btn btn-warning w-100">Stop Charging</button></div>
            <div class="col-sm-4 col-12"><button id="cmd-sentry-toggle" class="btn btn-primary w-100">Toggle Sentry Mode</button></div>
          </div>
          <div id="capture-tab" class="row g-2 w-100 d-none">
            <div class="col-sm-6 col-12">
              <select id="capture-label" class="form-select">
                <option value="baseline">baseline</option>
                <option value="climate_on">climate_on</option>
                <option value="climate_off">climate_off</option>
                <option value="temp_low">temp_low</option>
                <option value="temp_high">temp_high</option>
                <option value="defrost_on">defrost_on</option>
                <option value="defrost_off">defrost_off</option>
                <option value="charge_start">charge_start</option>
                <option value="charge_stop">charge_stop</option>
                <option value="lock">lock</option>
                <option value="unlock">unlock</option>
              </select>
            </div>
            <div class="col-sm-3 col-6"><input id="capture-seconds" class="form-control" type="number" min="10" max="600" value="180"></div>
            <div class="col-sm-3 col-6"><button id="capture-start" class="btn btn-success w-100">Start Capture</button></div>
            <div class="col-sm-3 col-12"><button id="capture-stop" class="btn btn-warning w-100">Stop Capture</button></div>
            <div id="capture-result" class="col-12 command-result">Capture idle</div>
          </div>
          <div id="videos-tab" class="row g-3 w-100 d-none">
            <div class="col-12">
              <div class="video-library-toolbar">
                <input id="video-search" type="text" class="token-input mb-0" placeholder="Search route name">
                <button id="videos-refresh" class="btn btn-outline-light">Refresh</button>
              </div>
            </div>
            <div class="col-12">
              <video id="library-video" class="library-video" playsinline controls preload="metadata"></video>
              <div id="library-video-label" class="command-result">Choose a route segment to play.</div>
            </div>
            <div class="col-12">
              <div id="videos-result" class="command-result">Video library idle</div>
            </div>
            <div class="col-12">
              <div id="video-route-list" class="video-route-list"></div>
            </div>
          </div>
          <div id="sentry-result" class="col-12 command-result">Sentry mode: unknown</div>
          <div id="command-result" class="col-12 command-result">-</div>
        </div>
      </div>
    </div>
    <script src="/static/js/jsmain.js" type="module"></script>
  </body>
</html>
